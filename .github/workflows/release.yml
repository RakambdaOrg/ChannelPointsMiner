name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  publish-docker-miner:
    name: Publish Miner on DockerHub
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-jib-publish.yml@main
    with:
      java-version: "21"
      gradle-project: ":miner"
      docker-image: ${{ vars.DOCKER_IMAGE_MINER }}
      docker-tag: latest
      environment: DockerHub
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}

  publish-docker-viewer:
    name: Publish Viewer on DockerHub
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-jib-publish.yml@main
    with:
      java-version: "21"
      gradle-project: ":viewer"
      docker-image: ${{ vars.DOCKER_IMAGE_VIEWER }}
      docker-tag: latest
      environment: DockerHub
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}

  publish-release:
    name: Publish Release
    permissions:
      contents: write
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-github-release.yml@main
    with:
      java-version: "21"
      files: |
        miner/build/libs/*-shaded.jar
        viewer/build/libs/viewer-*.jar
