name: Build and deploy project

on:
  push:
    branches:
      - main
    tags:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build project
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-build.yml@main
    with:
      java-version: "21"
      gradle-tasks: assemble
      artifact-name: jars
      artifact-archive: true
      artifact-path: |
        miner/build/libs/miner-shaded.jar
        viewer/build/libs/viewer-*.jar

  test-miner:
    name: Run miner tests
    needs: build
    permissions:
      contents: read
      checks: write
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-module-test.yml@main
    with:
      module: miner
      java-version: "21"
      send-codecov: true
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  test-viewer:
    name: Run viewer tests
    needs: build
    permissions:
      contents: read
      checks: write
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-module-test.yml@main
    with:
      module: viewer
      java-version: "21"
      send-codecov: true
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  publish-miner:
    name: Publish Miner on DockerHub
    needs:
      - test-miner
      - test-viewer
    if: github.ref == 'refs/heads/main'
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-jib-publish.yml@main
    with:
      java-version: "21"
      gradle-project: ":miner"
      docker-image: ${{ vars.DOCKER_IMAGE_MINER }}
      environment: DockerHub
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}

  publish-viewer:
    name: Publish Viewer on DockerHub
    needs:
      - test-miner
      - test-viewer
    if: github.ref == 'refs/heads/main'
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-jib-publish.yml@main
    with:
      java-version: "21"
      gradle-project: ":viewer"
      docker-image: ${{ vars.DOCKER_IMAGE_VIEWER }}
      environment: DockerHub
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}
